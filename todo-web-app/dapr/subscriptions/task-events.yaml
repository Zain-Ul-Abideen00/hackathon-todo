# Dapr Subscription: Task Events Topic

# Declarative subscription for recurring-service
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: task-events-subscription
  namespace: todo-app
spec:
  pubsubname: taskpubsub
  topic: task-events
  routes:
    default: /api/events/task
scopes:
  - recurring-service
