# Dapr Subscription: Task Updates Topic

# Declarative subscription for websocket-service
# For real-time multi-client sync (SDD Use Case 4)
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: task-updates-subscription
  namespace: todo-app
spec:
  pubsubname: taskpubsub
  topic: task-updates
  routes:
    default: /api/updates/handle
scopes:
  - websocket-service
