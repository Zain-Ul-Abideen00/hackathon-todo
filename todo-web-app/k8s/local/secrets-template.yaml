# Backend Secrets Template
# Copy this file and fill in actual values before applying

apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: todo-app
type: Opaque
stringData:
  # Database connection string (PostgreSQL)
  DATABASE_URL: "postgresql+asyncpg://user:password@neon-host:5432/database"

  # Better Auth secret (min 32 chars for JWT signing)
  BETTER_AUTH_SECRET: "your-secret-min-32-chars-here!!"

  # OpenAI/LiteLLM API Key (for chatbot)
  GEMINI_API_KEY: "your-gemini-api-key"

  # Groq API Key (fallback for chatbot)
  GROQ_API_KEY: "your-groq-api-key"
