apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-frontend.fullname" . }}-secret
  labels:
    {{- include "todo-frontend.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  BETTER_AUTH_SECRET: {{ .Values.secrets.betterAuthSecret | quote }}
