# Audit Service Helm Chart Values

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: todo-audit-service
  tag: "latest"
  pullPolicy: Never  # Use Never for Minikube local images

service:
  type: ClusterIP
  port: 8003
  targetPort: 8003

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "200m"

probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3

# Dapr sidecar configuration
dapr:
  enabled: true  # Required for pub/sub subscription
  appId: "audit-service"
  appPort: 8003
