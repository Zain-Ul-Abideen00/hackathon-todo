# Disables actors to prevent placement service connection attempts
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: localconfig
spec:
  # Disable actors (not used in this project)
  # This prevents the noisy "Failed to connect to placement" logs
  features:
    - name: Actor.Reentrancy
      enabled: false
  # Set log level to warn to reduce noise
  logging:
    apiLogging:
      enabled: false
